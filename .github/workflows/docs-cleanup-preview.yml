name: Clean up doc preview

on:
  pull_request_target:
    types: [closed, unlabeled]

jobs:
  cleanup:
    if: github.event.action == 'closed' || github.event.label.name == 'docs-preview'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Fork previews need deployment secrets; only run trusted default-branch code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Remove preview from docs repo
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.DOCS_DEPLOY_TOKEN }}@github.com/confusius-tools/confusius-docs.git" \
            docs-repo
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Recheck after queueing and cloning in case the PR was reopened or relabeled.
          PR=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          if jq -e '.state == "open" and any(.labels[]; .name == "docs-preview")' <<< "$PR" > /dev/null; then
            echo 'removed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_DIR="pr-preview/pr-${{ github.event.number }}"
          if [ -d "$PR_DIR" ]; then
            git rm -rf "$PR_DIR"
          fi

          VERSIONS_FILE="pr-preview/versions.json"
          if [ -f "$VERSIONS_FILE" ]; then
            PR_ENTRY=$(jq --arg ver "pr-${{ github.event.number }}" \
              '.[] | select(.version == $ver)' "$VERSIONS_FILE")
            if [ -n "$PR_ENTRY" ]; then
              jq --arg ver "pr-${{ github.event.number }}" \
                '[.[] | select(.version != $ver)]' "$VERSIONS_FILE" > versions_new.json
              mv versions_new.json "$VERSIONS_FILE"
              git add "$VERSIONS_FILE"
            fi
          fi

          python ../tools/deduplicate_docs_assets.py .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: remove preview for PR #${{ github.event.number }}"
            git push
          fi
          echo 'removed=true' >> "$GITHUB_OUTPUT"

      - name: Delete preview comment
        if: steps.cleanup.outputs.removed == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          delete: true
